name: Scraper Bot (GAS Triggered)

on:
  repository_dispatch:
    types: [trigger-from-gas]
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp apify-client gspread google-api-python-client google-auth-oauthlib

      - name: Run Bot Script
        env:
          YOUTUBE_API_KEYS: ${{ secrets.YOUTUBE_API_KEYS }}
          APIFY_TOKENS: ${{ secrets.APIFY_TOKENS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: python bot.py
